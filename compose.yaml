version: "3.9"

services:

  ####################################
  # Spring Boot Backend
  ####################################
  spring-backend:

    build:
      context: ./HealthAppBackendJava
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_ENABLED: ${CLOUDINARY_ENABLED}

      FILE_STORAGE_LOCAL_DIRECTORY: ${FILE_STORAGE_LOCAL_DIRECTORY}

    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy

    volumes:
      - uploads:/app/uploads

    networks:
      - health-network


  ####################################
  # Express Backend
  ####################################
  express-backend:

    build:
      context: ./MongoBackend
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - ./MongoBackend/.env

    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_started

    networks:
      - health-network


  ####################################
  # Redis
  ####################################
  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    expose:
      - "6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - health-network


################################################
# nginx
###############################################

  nginx:
    image: nginx:1.29-alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      spring-backend:
        condition: service_started

      express-backend:
        condition: service_started

    networks:
      - health-network

##################################################
# Mysql
#################################################

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: healthdb

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - health-network

##################################################
# Networks
##################################################

networks:
  health-network:
    driver: bridge


##################################################
# Volumes
##################################################

volumes:
  redis-data:
  uploads:
  mysql-data: